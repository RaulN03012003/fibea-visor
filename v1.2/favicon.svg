<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#000000"/>
  <!-- vela 1: bajista (roja) -->
  <line x1="16" y1="10" x2="16" y2="54" stroke="#ef5350" stroke-width="3" stroke-linecap="round"/>
  <rect x="10" y="20" width="12" height="18" rx="2" fill="#ef5350"/>
  <!-- vela 2: alcista (verde), la mas alta, al centro -->
  <line x1="32" y1="6" x2="32" y2="58" stroke="#26c6a6" stroke-width="3" stroke-linecap="round"/>
  <rect x="26" y="14" width="12" height="30" rx="2" fill="#26c6a6"/>
  <!-- vela 3: alcista (verde) -->
  <line x1="48" y1="16" x2="48" y2="48" stroke="#26c6a6" stroke-width="3" stroke-linecap="round"/>
  <rect x="42" y="24" width="12" height="14" rx="2" fill="#26c6a6"/>
</svg>
