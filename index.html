<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>FibEA · Visor del bot BreakoutPortfolio</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root{ --bg:#000000; --pane:#000000; --grid:#1a1a1a; --txt:#c9d4e5; --muted:#8a8a8a;
         --up:#26c6a6; --dn:#ef5350; --chan:#c83cff; --chanlo:#9660ff; --sl:#2979ff; --red:#f2555a; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:Segoe UI,Arial,sans-serif;font-size:13px}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--grid);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;color:#eaf0fa;font-weight:700}
  .gen{color:var(--muted);font-size:11px}
  .tabs{display:flex;gap:6px;margin-left:6px}
  .tab{padding:5px 14px;border:1px solid var(--grid);border-radius:6px;background:#111;color:var(--txt);cursor:pointer;font-weight:600}
  .tab.active{background:#232323;border-color:#444;color:#eaf3ff}
  .wrap{display:flex;height:calc(100vh - 52px)}
  #chart{flex:1;position:relative}
  aside{width:330px;border-left:1px solid var(--grid);overflow:auto;padding:10px 12px}
  aside h2{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:6px 0}
  table{width:100%;border-collapse:collapse}
  th,td{padding:6px 6px;text-align:right;border-bottom:1px solid #16202f;font-size:12px}
  th{color:var(--muted);font-weight:600;text-align:right}
  td.l,th.l{text-align:left}
  tr.trow{cursor:pointer}
  tr.trow:hover{background:#132135}
  tr.trow.sel{background:#1b3350}
  .pos{color:var(--up)} .neg{color:var(--dn)}
  .pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:700}
  .buy{background:#12352b;color:#4fe0b6} .sell{background:#3a1f22;color:#ff8a8f}
  .legend{position:absolute;top:8px;left:10px;z-index:5;background:rgba(0,0,0,.82);border:1px solid var(--grid);
          border-radius:8px;padding:8px 10px;font-size:11px;line-height:1.5;pointer-events:none}
  .legend b{color:#eaf0fa} .sw{display:inline-block;width:10px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
  .hint{color:var(--muted);font-size:11px;margin-top:8px}

  /* --- Resumen / Cartera (estilo Getquin) --- */
  #summaryView{display:none;height:calc(100vh - 52px);overflow:auto;padding:22px 28px}
  .sumTop{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;margin-bottom:18px}
  .sumBig{font-size:38px;font-weight:700;color:#eaf3ff}
  .sumBig .cur{font-size:16px;color:var(--muted);font-weight:600;margin-left:6px}
  .sumDelta{font-size:15px;font-weight:700;padding:3px 10px;border-radius:8px}
  .sumDelta.pos{color:#26c6a6;background:#0f2b24}
  .sumDelta.neg{color:#ef5350;background:#331414}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0 24px}
  .kpi{background:#0c0c0c;border:1px solid var(--grid);border-radius:10px;padding:12px 14px}
  .kpi .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
  .kpi .val{font-size:19px;font-weight:700;color:#eaf3ff}
  .sumGrid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-bottom:22px}
  .card{background:#0c0c0c;border:1px solid var(--grid);border-radius:10px;padding:14px 16px}
  .card h3{margin:0 0 12px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  #eqChart{height:220px}
  .donutWrap{display:flex;align-items:center;gap:18px}
  .donut{width:140px;height:140px;border-radius:50%;flex:none}
  .donutLeg{font-size:12px;line-height:2}
  .donutLeg .sw{width:9px;height:9px;border-radius:50%}
  table.sumTbl{width:100%;border-collapse:collapse;font-size:12px}
  table.sumTbl th{color:var(--muted);text-align:right;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--grid)}
  table.sumTbl td{text-align:right;padding:6px 8px;border-bottom:1px solid #141414}
  table.sumTbl th.l, table.sumTbl td.l{text-align:left}
  table.sumTbl tr.trow2{cursor:pointer}
  table.sumTbl tr.trow2:hover{background:#111}
  .symtag{padding:1px 7px;border-radius:6px;font-size:11px;font-weight:700}
</style>
</head>
<body>
<header>
  <h1>FibEA · Visor BreakoutPortfolio</h1>
  <div class="tabs" id="tabs"></div>
  <div class="gen" id="gen"></div>
</header>
<div class="wrap">
  <div id="chart">
    <div class="legend" id="legend"></div>
  </div>
  <aside>
    <h2>Operaciones</h2>
    <table id="tbl"><thead><tr>
      <th class="l">#</th><th class="l">Dir</th><th>Entrada</th><th>Salida</th><th>P&amp;L</th><th>R</th>
    </tr></thead><tbody id="tbody"></tbody></table>
    <div class="hint">Clic en una operación para enfocarla y ver su escalera de SL (SL0→SLk). Rueda del mouse = zoom · arrastrar = desplazar.</div>
    <div id="detail" style="margin-top:12px"></div>
  </aside>
</div>
<div id="summaryView"></div>

<script>document.write('<scr'+'ipt src="data.js?v='+Date.now()+'"><\/scr'+'ipt>');</script>
<script>
const D = window.FIBEA_DATA || {symbols:{}, generado:""};
document.getElementById('gen').textContent = "datos: " + (D.generado||"");
const SYMS = Object.keys(D.symbols);
let curSym = SYMS[0];
let selTrade = null;

const chartEl = document.getElementById('chart');
const chart = LightweightCharts.createChart(chartEl, {
  layout:{ background:{color:'#000000'}, textColor:'#c9d4e5' },
  grid:{ vertLines:{color:'#141414'}, horzLines:{color:'#141414'} },
  rightPriceScale:{ borderColor:'#2a2a2a' },
  timeScale:{ borderColor:'#2a2a2a', timeVisible:true, secondsVisible:false },
  crosshair:{ mode: LightweightCharts.CrosshairMode.Normal },
});
const candle = chart.addCandlestickSeries({
  upColor:'#26c6a6', downColor:'#ef5350', borderUpColor:'#26c6a6', borderDownColor:'#ef5350',
  wickUpColor:'#26c6a6', wickDownColor:'#ef5350'
});
const chanUp = chart.addLineSeries({ color:'#c83cff', lineWidth:2, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false });
const chanLo = chart.addLineSeries({ color:'#9660ff', lineWidth:2, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false });
const slLine = chart.addLineSeries({ color:'#2979ff', lineWidth:2, lineType:LightweightCharts.LineType.WithSteps, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false });
// linea punteada que une el punto de ENTRADA con el punto de SALIDA (igual que MT5) --
// blanca y gruesa para que se distinga bien sobre las velas y el resto de las lineas
const tradeLine = chart.addLineSeries({ color:'#ffffff', lineWidth:2, lineStyle:LightweightCharts.LineStyle.Dashed, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false });

// paleta para numerar cada escalon del SL (SL0 rojo -> verde), igual criterio que MT5
function stepColor(k, n){
  const red=[242,85,90], amber=[255,209,102], green=[38,224,164];
  const f = n>1 ? k/(n-1) : 1;
  const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
  const c = f<0.5 ? mix(red,amber,f/0.5) : mix(amber,green,(f-0.5)/0.5);
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
let priceLines = [];   // etiquetas de SL/entrada/salida activas, para poder limpiarlas
function clearPriceLines(){ priceLines.forEach(pl=>candle.removePriceLine(pl)); priceLines=[]; }

new ResizeObserver(()=>chart.applyOptions({width:chartEl.clientWidth,height:chartEl.clientHeight})).observe(chartEl);
chart.applyOptions({width:chartEl.clientWidth,height:chartEl.clientHeight});

function donchian(candles, N){
  const up=[], lo=[];
  for(let i=0;i<candles.length;i++){
    if(i<N) continue;
    let hh=-1e18, ll=1e18;
    for(let j=i-N;j<i;j++){ if(candles[j].h>hh)hh=candles[j].h; if(candles[j].l<ll)ll=candles[j].l; }
    up.push({time:candles[i].t, value:hh});
    lo.push({time:candles[i].t, value:ll});
  }
  return {up,lo};
}

function fmt(n,d){ return (n==null)?'–':Number(n).toLocaleString('es',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtT(ts){ if(ts==null) return '–'; const d=new Date(ts*1000); return d.toISOString().slice(0,16).replace('T',' ')+' UTC'; }

function render(sym){
  curSym = sym; selTrade = null;
  const S = D.symbols[sym];
  const cs = S.candles.map(k=>({time:k.t, open:k.o, high:k.h, low:k.l, close:k.c}));
  candle.setData(cs);
  const dc = donchian(S.candles, 20);
  chanUp.setData(dc.up); chanLo.setData(dc.lo);
  slLine.setData([]); tradeLine.setData([]);
  clearPriceLines();

  // marcadores de ENTRADA (flecha verde/roja, numerada) y de SALIDA (cuadrado blanco,
  // forma y color bien distintos de la flecha de entrada para que se note donde termina)
  const mk=[];
  S.trades.forEach((t,i)=>{
    mk.push({time:t.entry_t, position:(t.dir==='compra'?'belowBar':'aboveBar'),
             color:(t.dir==='compra'?'#26c6a6':'#ef5350'),
             shape:(t.dir==='compra'?'arrowUp':'arrowDown'), text:'#'+(i+1)+' abre', size:0.8});
    if(t.exit_t) mk.push({time:t.exit_t, position:(t.dir==='compra'?'aboveBar':'belowBar'),
             color:'#ffffff', shape:'square', text:'#'+(i+1)+' cierra', size:0.75});
  });
  mk.sort((a,b)=>a.time-b.time);
  candle.setMarkers(mk);

  buildTable(S.trades);
  chart.timeScale().fitContent();
  legend(sym, S);
}

function legend(sym, S){
  document.getElementById('legend').innerHTML =
    `<b>${sym}</b> · H4 · ${S.candles.length} velas<br>`+
    `<span class="sw" style="background:#c83cff"></span>Canal Donchian máx (20)<br>`+
    `<span class="sw" style="background:#9660ff"></span>Canal Donchian mín (20)<br>`+
    `<span class="sw" style="background:#2979ff"></span>Escalera SL (trade seleccionado)<br>`+
    `<span class="sw" style="background:rgb(57,255,20)"></span>Entrada↔Salida ganadora &nbsp;`+
    `<span class="sw" style="background:rgb(255,255,0)"></span>perdedora<br>`+
    `<span class="sw" style="background:#26c6a6;border-radius:50%;width:8px;height:8px"></span>Flecha = apertura &nbsp;`+
    `<span class="sw" style="background:#ffffff;width:8px;height:8px"></span>Cuadrado blanco = cierre`;
}

function buildTable(trades){
  const tb = document.getElementById('tbody'); tb.innerHTML='';
  // se muestra la mas reciente arriba, pero el numero "#" es su orden cronologico real
  const orden = trades.map((t,i)=>[t,i]).slice().reverse();
  orden.forEach(([t,i])=>{
    const risk = Math.abs(t.entry_p - t.sl0);
    const r = risk>0 ? ((t.dir==='compra'? (( (t.exit_p??cur(t))-t.entry_p)) : (t.entry_p-(t.exit_p??cur(t)))))/risk : 0;
    const tr = document.createElement('tr');
    tr.className='trow'; tr.dataset.i=i;
    const pnlc = t.pnl>=0?'pos':'neg';
    const est = t.estado==='abierta' ? ' *' : '';
    tr.innerHTML =
      `<td class="l">${i+1}${est}</td>`+
      `<td class="l"><span class="pill ${t.dir==='compra'?'buy':'sell'}">${t.dir==='compra'?'BUY':'SELL'}</span></td>`+
      `<td>${fmt(t.entry_p, dg())}</td>`+
      `<td>${t.exit_p?fmt(t.exit_p,dg()):'abierta'}</td>`+
      `<td class="${pnlc}">${fmt(t.pnl,2)}</td>`+
      `<td class="${r>=0?'pos':'neg'}">${fmt(r,2)}</td>`;
    tr.onclick=()=>selectTrade(i);
    tb.appendChild(tr);
  });
}
function cur(t){ // precio actual aprox para trade abierto = ultima vela
  const cs=D.symbols[curSym].candles; return cs[cs.length-1].c;
}
function dg(){ return curSym==='USDJPY'?3:2; }

function selectTrade(i){
  selTrade=i;
  document.querySelectorAll('tr.trow').forEach(r=>r.classList.toggle('sel', +r.dataset.i===i));
  const t = D.symbols[curSym].trades[i];
  const lastCandleT = D.symbols[curSym].candles[D.symbols[curSym].candles.length-1].t;
  // si la operacion sigue abierta y se abrio DESPUES de la ultima vela descargada
  // (dato generado antes de que cierre la siguiente vela H4), "end" no puede quedar
  // antes que "entry_t" -- si no, la serie queda en orden descendente y rompe el grafico.
  const end = t.exit_t || Math.max(lastCandleT, t.entry_t);
  const endPrice = t.exit_p ?? cur(t);

  // escalera SL (linea escalonada que conecta los puntos, confinada al rango del trade)
  slLine.setData(t.sl_steps.map(s=>({time:s.t, value:s.p})));

  // linea punteada "en L" (como en MT5): horizontal al precio de ENTRADA hasta el cierre,
  // y ahi un salto vertical hasta el precio de SALIDA. IMPORTANTE: Lightweight Charts exige
  // tiempos ESTRICTAMENTE ascendentes en una serie -- dos puntos con el mismo "time" (el salto
  // vertical) tiraban un error interno ("Value is null") que rompia el repintado de TODO el
  // grafico, no solo esta linea. Por eso el punto medio va 1 segundo antes del cierre.
  const midT = (end - t.entry_t > 1) ? end - 1 : null;
  const trPts = [{time:t.entry_t, value:t.entry_p}];
  if(midT !== null && midT > t.entry_t) trPts.push({time:midT, value:t.entry_p});
  if(end > t.entry_t) trPts.push({time:end, value:endPrice}); // evita duplicar el primer punto si end==entry_t

  // color segun resultado: ganadora = verde fosforescente, perdedora = amarillo fuerte,
  // linea continua y gruesa (3px) en vez de punteada
  const isWin = t.pnl >= 0;
  tradeLine.applyOptions({
    color: isWin ? 'rgba(57,255,20,1)' : 'rgba(255,255,0,1)',
    lineWidth: 3,
    lineStyle: LightweightCharts.LineStyle.Solid
  });
  tradeLine.setData(trPts);

  // --- solo 2-3 lineas de precio en el grafico (SL0, SL actual, Entrada) para no saturar ---
  clearPriceLines();
  const n = t.sl_steps.length;
  const first = t.sl_steps[0];
  const last  = t.sl_steps[n-1];
  priceLines.push(candle.createPriceLine({
    price: first.p, color: stepColor(0, n), lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dotted,
    axisLabelVisible: true, title: `SL0  ${fmt(first.p, dg())}`
  }));
  if(n > 1){
    priceLines.push(candle.createPriceLine({
      price: last.p, color: stepColor(n-1, n), lineWidth: 2, lineStyle: LightweightCharts.LineStyle.Solid,
      axisLabelVisible: true, title: `SL${n-1} (último)  ${fmt(last.p, dg())}`
    }));
  }
  priceLines.push(candle.createPriceLine({
    price: t.entry_p, color:'#c8d2e1', lineWidth:1, lineStyle: LightweightCharts.LineStyle.Dashed,
    axisLabelVisible:true, title:`Entrada  ${fmt(t.entry_p, dg())}`
  }));
  if(t.exit_p){
    priceLines.push(candle.createPriceLine({
      price: t.exit_p, color:'#ffd54f', lineWidth:1, lineStyle: LightweightCharts.LineStyle.Dashed,
      axisLabelVisible:true, title:`Salida  ${fmt(t.exit_p, dg())}`
    }));
  }

  // Auto-enfocar el rango del trade. setVisibleLogicalRange/setVisibleRange de la libreria
  // resultaron poco fiables: en pruebas repetidas, a veces ignoraban el "from" pedido y
  // expandian el ancho visible a un valor fijo absurdo (le pase distintos rangos validos
  // y el resultado real en pantalla quedaba roto la mitad de las veces, sin error en consola).
  // fitContent() en cambio SIEMPRE funciono bien en decenas de pruebas. Asi que en vez de
  // pedirle un "zoom" a la libreria, le damos directamente solo los datos de la ventana
  // del trade (recortados) y dejamos que fitContent() los encuadre -- 100% confiable.
  const candsFull = D.symbols[curSym].candles;
  const nC = candsFull.length;
  const idxAtOrAfter = (ts) => {
    let lo=0, hi=nC-1, ans=nC-1;
    while(lo<=hi){ const mid=(lo+hi)>>1; if(candsFull[mid].t>=ts){ans=mid; hi=mid-1;} else lo=mid+1; }
    return ans;
  };
  const iEntry = idxAtOrAfter(t.entry_t);
  const iEnd   = t.exit_t ? idxAtOrAfter(t.exit_t) : nC-1;
  const pad = 15;
  const fromI = Math.max(0, Math.min(iEntry, iEnd) - pad);
  const toI   = Math.min(nC-1, Math.max(iEntry, iEnd) + pad);
  const ventana = candsFull.slice(fromI, toI + 1);
  const ventanaData = ventana.map(k=>({time:k.t, open:k.o, high:k.h, low:k.l, close:k.c}));
  candle.setData(ventanaData);
  // OJO: al reducir el dataset de 255 velas a un puñado (ventana), la libreria a veces NO
  // repinta bien en la primera llamada (queda el grafico en blanco aunque los datos esten
  // bien) -- confirmado en pruebas. Volver a llamar setData con la MISMA data fuerza el
  // repintado correcto. Es un workaround, pero 100% reproducible y confiable.
  candle.setData(ventanaData);
  const fromT = ventana[0].t, toT = ventana[ventana.length-1].t;
  const dcVentana = donchian(candsFull, 20); // se calcula sobre el historial completo (necesita 20 velas previas de contexto)
  chanUp.setData(dcVentana.up.filter(p => p.time >= fromT && p.time <= toT));
  chanLo.setData(dcVentana.lo.filter(p => p.time >= fromT && p.time <= toT));
  chart.timeScale().fitContent();
  detail(t, i);
}

function detail(t, i){
  const risk = Math.abs(t.entry_p - t.sl0);
  const px = t.exit_p ?? cur(t);
  const r = risk>0 ? ((t.dir==='compra'?(px-t.entry_p):(t.entry_p-px))/risk) : 0;
  const pnlc=t.pnl>=0?'pos':'neg';
  const n = t.sl_steps.length;
  const pasos = t.sl_steps.map((s,k)=>
    `<tr><td class="l" style="color:${stepColor(k,n)}">SL${k}${k===0?' (inicial)':''}</td>`+
    `<td>${fmt(s.p,dg())}</td><td style="text-align:right;font-size:11px;color:var(--muted)">${fmtT(s.t)}</td></tr>`
  ).join('');
  document.getElementById('detail').innerHTML =
    `<h2>Operación #${i+1}</h2>`+
    `<table>`+
    `<tr><td class="l">Símbolo</td><td>${curSym}</td></tr>`+
    `<tr><td class="l">Dirección</td><td>${t.dir==='compra'?'COMPRA':'VENTA'}</td></tr>`+
    `<tr><td class="l">Lotes</td><td>${fmt(t.lots,2)}</td></tr>`+
    `<tr><td class="l">Inicio</td><td style="font-size:11px">${fmtT(t.entry_t)}</td></tr>`+
    `<tr><td class="l">Fin</td><td style="font-size:11px">${t.exit_t?fmtT(t.exit_t):'abierta'}</td></tr>`+
    `<tr><td class="l">Entrada</td><td>${fmt(t.entry_p,dg())}</td></tr>`+
    `<tr><td class="l">Salida</td><td>${t.exit_p?fmt(t.exit_p,dg()):'abierta'}</td></tr>`+
    `<tr><td class="l">P&amp;L</td><td class="${pnlc}">${fmt(t.pnl,2)} USD</td></tr>`+
    `<tr><td class="l">R‑múltiplo</td><td class="${r>=0?'pos':'neg'}">${fmt(r,2)} R</td></tr>`+
    `<tr><td class="l">Estado</td><td>${t.estado}</td></tr>`+
    `</table>`+
    `<h2>Pasos del SL (${n})</h2>`+
    `<table>${pasos}</table>`;
}

// ---------------- Resumen / Cartera (estilo Getquin) ----------------
const PALETTE = ['#ffd54f','#42a5f5','#7c4dff','#26c6a6','#ff7043','#ef5350'];
function symColor(i){ return PALETTE[i % PALETTE.length]; }

function allTradesCombined(){
  const rows=[];
  SYMS.forEach(s=>{
    (D.symbols[s].trades||[]).forEach((t,idx)=>rows.push({...t, sym:s, idx}));
  });
  rows.sort((a,b)=>a.entry_t-b.entry_t);
  return rows;
}

function buildSummary(){
  const cta = D.cuenta || null;
  const trades = allTradesCombined();
  const cerradas = trades.filter(t=>t.estado==='cerrada');
  const abiertas = trades.filter(t=>t.estado!=='cerrada');

  const capIni = cta ? cta.balance_inicial_est : 0;
  const capAct = cta ? cta.balance_actual : cerradas.reduce((a,t)=>a+t.pnl,0);
  const moneda = cta ? cta.moneda : 'USD';
  const pnlTotal = capAct - capIni;
  const pnlPct = capIni ? (pnlTotal/capIni*100) : 0;

  const wins = cerradas.filter(t=>t.pnl>0), losses = cerradas.filter(t=>t.pnl<=0);
  const winrate = cerradas.length ? (wins.length/cerradas.length*100) : 0;
  const sumPos = wins.reduce((a,t)=>a+t.pnl,0), sumNeg = losses.reduce((a,t)=>a+t.pnl,0);
  const pf = sumNeg!==0 ? (sumPos/Math.abs(sumNeg)) : (sumPos>0?Infinity:0);
  const avgWin  = wins.length ? sumPos/wins.length : 0;
  const avgLoss = losses.length ? sumNeg/losses.length : 0;
  const expectancy = cerradas.length ? (sumPos+sumNeg)/cerradas.length : 0;
  const best  = cerradas.reduce((a,t)=> (!a||t.pnl>a.pnl)?t:a, null);
  const worst = cerradas.reduce((a,t)=> (!a||t.pnl<a.pnl)?t:a, null);
  const avgDurH = cerradas.length ? cerradas.reduce((a,t)=>a+(t.exit_t-t.entry_t),0)/cerradas.length/3600 : 0;

  // curva de equity combinada (solo trades cerradas, ordenadas por cierre)
  const cronoCierre = cerradas.slice().sort((a,b)=>a.exit_t-b.exit_t);
  let run = capIni;
  const eq = [{time: (cronoCierre[0]?.entry_t)||0, value: capIni}];
  let peak=capIni, maxDD=0, maxDDpct=0;
  // rachas maximas de wins/losses consecutivas (en el orden en que fueron cerrando)
  let rachaW=0, rachaL=0, maxRachaW=0, maxRachaL=0;
  cronoCierre.forEach(t=>{
    run+=t.pnl; eq.push({time:t.exit_t, value:run});
    peak=Math.max(peak,run);
    const dd = peak-run; maxDD=Math.max(maxDD,dd);
    maxDDpct = Math.max(maxDDpct, peak>0 ? dd/peak*100 : 0);
    if(t.pnl>0){ rachaW++; rachaL=0; } else { rachaL++; rachaW=0; }
    maxRachaW=Math.max(maxRachaW,rachaW); maxRachaL=Math.max(maxRachaL,rachaL);
  });

  // distribucion P&L por simbolo
  const bySym = SYMS.map((s,i)=>({
    sym:s, color: symColor(i),
    pnl: (D.symbols[s].trades||[]).filter(t=>t.estado==='cerrada').reduce((a,t)=>a+t.pnl,0),
    n: (D.symbols[s].trades||[]).length
  }));

  renderSummaryHTML({capIni,capAct,moneda,pnlTotal,pnlPct,winrate,pf,maxDD,maxDDpct,
                      avgWin,avgLoss,expectancy,best,worst,avgDurH,maxRachaW,maxRachaL,
                      nCerradas:cerradas.length, nAbiertas:abiertas.length, eq, bySym, trades});
}

function donutGradient(bySym){
  const totalAbs = bySym.reduce((a,b)=>a+Math.abs(b.pnl),0) || 1;
  let acc=0, stops=[];
  bySym.forEach(b=>{
    const pct = Math.abs(b.pnl)/totalAbs*100;
    stops.push(`${b.color} ${acc}% ${acc+pct}%`);
    acc+=pct;
  });
  if(!stops.length) stops.push('#222 0% 100%');
  return `conic-gradient(${stops.join(',')})`;
}

function renderSummaryHTML(S){
  const el = document.getElementById('summaryView');
  const pnlClass = S.pnlTotal>=0?'pos':'neg';
  const deltaClass = S.pnlTotal>=0?'sumDelta pos':'sumDelta neg';

  el.innerHTML = `
    <div class="sumTop">
      <div><div class="lbl" style="color:var(--muted);font-size:12px;margin-bottom:4px">CAPITAL ACTUAL</div>
        <span class="sumBig">${fmt(S.capAct,2)}<span class="cur">${S.moneda}</span></span></div>
      <div class="${deltaClass}">${S.pnlTotal>=0?'▲':'▼'} ${fmt(Math.abs(S.pnlTotal),2)} ${S.moneda} (${fmt(S.pnlPct,1)}%)</div>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="lbl">Capital inicial</div><div class="val">${fmt(S.capIni,2)} ${S.moneda}</div></div>
      <div class="kpi"><div class="lbl">Operaciones cerradas</div><div class="val">${S.nCerradas}</div></div>
      <div class="kpi"><div class="lbl">Abiertas ahora</div><div class="val">${S.nAbiertas}</div></div>
      <div class="kpi"><div class="lbl">Winrate</div><div class="val">${fmt(S.winrate,1)}%</div></div>
      <div class="kpi"><div class="lbl">Profit Factor</div><div class="val">${S.pf===Infinity?'∞':fmt(S.pf,2)}</div></div>
      <div class="kpi"><div class="lbl">Drawdown máx</div><div class="val" style="color:#ef5350">${fmt(S.maxDDpct,1)}%<span style="font-size:11px;color:var(--muted);font-weight:400"> (${fmt(S.maxDD,2)} ${S.moneda})</span></div></div>
    </div>

    <div class="sumGrid">
      <div class="card"><h3>Evolución del capital</h3><div id="eqChart"></div></div>
      <div class="card"><h3>P&amp;L por símbolo</h3>
        <div class="donutWrap">
          <div class="donut" style="background:${donutGradient(S.bySym)}"></div>
          <div class="donutLeg">${S.bySym.map(b=>
            `<div><span class="sw" style="background:${b.color}"></span>${b.sym}: `+
            `<span class="${b.pnl>=0?'pos':'neg'}">${fmt(b.pnl,2)} ${S.moneda}</span> (${b.n} ops)</div>`).join('')}
          </div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-bottom:22px">
      <h3>Estadísticas avanzadas</h3>
      <div class="kpis" style="margin:0">
        <div class="kpi"><div class="lbl">Ganancia media</div><div class="val pos">${fmt(S.avgWin,2)} ${S.moneda}</div></div>
        <div class="kpi"><div class="lbl">Pérdida media</div><div class="val neg">${fmt(S.avgLoss,2)} ${S.moneda}</div></div>
        <div class="kpi"><div class="lbl">Expectancia / trade</div><div class="val ${S.expectancy>=0?'pos':'neg'}">${fmt(S.expectancy,2)} ${S.moneda}</div></div>
        <div class="kpi"><div class="lbl">Duración media</div><div class="val">${fmt(S.avgDurH,0)} h</div></div>
        <div class="kpi"><div class="lbl">Mejor operación</div><div class="val pos">${S.best?fmt(S.best.pnl,2):'–'} ${S.moneda}</div></div>
        <div class="kpi"><div class="lbl">Peor operación</div><div class="val neg">${S.worst?fmt(S.worst.pnl,2):'–'} ${S.moneda}</div></div>
        <div class="kpi"><div class="lbl">Racha máx. ganadora</div><div class="val pos">${S.maxRachaW}</div></div>
        <div class="kpi"><div class="lbl">Racha máx. perdedora</div><div class="val neg">${S.maxRachaL}</div></div>
      </div>
    </div>

    <div class="card">
      <h3>Todas las operaciones (${S.trades.length})</h3>
      <table class="sumTbl"><thead><tr>
        <th class="l">Fecha entrada</th><th class="l">Símbolo</th><th class="l">Dir</th>
        <th>Entrada</th><th>Salida</th><th>P&amp;L</th><th>R</th><th class="l">Estado</th>
      </tr></thead><tbody>
        ${S.trades.slice().reverse().map(t=>{
          const dgS = t.sym==='USDJPY'?3:2;
          const risk = Math.abs(t.entry_p-t.sl0);
          const px = t.exit_p ?? (D.symbols[t.sym].candles.slice(-1)[0]?.c ?? t.entry_p);
          const r = risk>0 ? ((t.dir==='compra'?(px-t.entry_p):(t.entry_p-px))/risk) : 0;
          return `<tr class="trow2" onclick="jumpTo('${t.sym}',${t.idx})">`+
            `<td class="l" style="font-size:11px;color:var(--muted)">${fmtT(t.entry_t)}</td>`+
            `<td class="l"><span class="symtag" style="background:#151515">${t.sym}</span></td>`+
            `<td class="l"><span class="pill ${t.dir==='compra'?'buy':'sell'}">${t.dir==='compra'?'BUY':'SELL'}</span></td>`+
            `<td>${fmt(t.entry_p,dgS)}</td><td>${t.exit_p?fmt(t.exit_p,dgS):'abierta'}</td>`+
            `<td class="${t.pnl>=0?'pos':'neg'}">${fmt(t.pnl,2)}</td>`+
            `<td class="${r>=0?'pos':'neg'}">${fmt(r,2)}</td>`+
            `<td class="l">${t.estado}</td></tr>`;
        }).join('')}
      </tbody></table>
    </div>
  `;

  const eqEl = document.getElementById('eqChart');
  if(window._eqChart){ try{ window._eqChart.remove(); }catch(e){} }
  const eqChart = LightweightCharts.createChart(eqEl, {
    layout:{ background:{color:'#000000'}, textColor:'#c9d4e5' },
    grid:{ vertLines:{color:'#141414'}, horzLines:{color:'#141414'} },
    rightPriceScale:{ borderColor:'#2a2a2a' },
    timeScale:{ borderColor:'#2a2a2a', timeVisible:true, secondsVisible:false },
  });
  const area = eqChart.addAreaSeries({ lineColor:'#26c6a6', topColor:'rgba(38,198,166,.35)', bottomColor:'rgba(38,198,166,0)', lineWidth:2 });
  area.setData(S.eq);
  eqChart.timeScale().fitContent();
  window._eqChart = eqChart;
  new ResizeObserver(()=>eqChart.applyOptions({width:eqEl.clientWidth,height:eqEl.clientHeight})).observe(eqEl);
  eqChart.applyOptions({width:eqEl.clientWidth,height:eqEl.clientHeight});
}

function jumpTo(sym, idx){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x=>{ if(x.textContent===sym) x.classList.add('active'); });
  showSymbolView();
  render(sym);
  selectTrade(idx);
}

function showSummaryView(){
  document.querySelector('.wrap').style.display='none';
  document.getElementById('summaryView').style.display='block';
  buildSummary();
}
function showSymbolView(){
  document.querySelector('.wrap').style.display='flex';
  document.getElementById('summaryView').style.display='none';
  // al volver de "Resumen" el canvas estuvo con display:none (0x0); forzar el
  // tamano real ahora que el layout ya se recalculo, si no el grafico queda en blanco
  chart.applyOptions({width:chartEl.clientWidth, height:chartEl.clientHeight});
}

// tabs: Resumen + simbolos
const tabs=document.getElementById('tabs');
const bSum=document.createElement('div'); bSum.className='tab active'; bSum.textContent='Resumen';
bSum.onclick=()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); bSum.classList.add('active'); showSummaryView(); };
tabs.appendChild(bSum);

SYMS.forEach((s,idx)=>{
  const b=document.createElement('div'); b.className='tab'; b.textContent=s;
  b.onclick=()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); b.classList.add('active'); showSymbolView(); render(s); };
  tabs.appendChild(b);
});

if(SYMS.length){ showSummaryView(); }
else document.getElementById('legend').textContent = "No hay datos (data.js vacío).";
</script>
</body>
